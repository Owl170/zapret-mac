name: Automatic version and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  native:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/macos-check.yml
    permissions:
      contents: read
  release:
    needs: native
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main
      - name: Check current main and existing tag
        id: current
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" != "$(git rev-parse HEAD)" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Main changed after checkout; this run will not modify it. Use workflow_dispatch on current main if publication is needed.'
            exit 0
          fi
          python3 scripts/release_state.py --event "$GITHUB_SHA"
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Python checks
        id: tests
        if: steps.current.outputs.ready == 'true'
        run: python3 -X utf8 scripts/run_tests.py
      - name: Calculate next semantic version
        id: calculate
        if: steps.current.outputs.ready == 'true' && steps.current.outputs.tag == '' && steps.current.outputs.resume_version == ''
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: '^main$'
          default_bump: patch
          initial_version: 0.2.0
          dry_run: true
      - name: Synchronize release files
        id: version
        if: steps.current.outputs.ready == 'true'
        env:
          EXISTING_TAG: ${{ steps.current.outputs.tag }}
          RESUME_VERSION: ${{ steps.current.outputs.resume_version }}
          NEXT_VERSION: ${{ steps.calculate.outputs.new_version }}
          TESTS_PASSED: ${{ steps.tests.outputs.passed }}
        shell: bash
        run: |
          if [[ -n "$EXISTING_TAG" ]]; then
            version="${EXISTING_TAG#v}"
            python3 scripts/update_version.py "$version" --check
            commit=false
          elif [[ -n "$RESUME_VERSION" ]]; then
            version="$RESUME_VERSION"
            python3 scripts/update_version.py "$version" --check
            commit=false
          else
            version="$NEXT_VERSION"
            if [[ -z "$version" ]]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            python3 scripts/update_version.py "$version" --tests-passed "$TESTS_PASSED" --platform 'GitHub Actions Ubuntu'
            commit=true
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Build and verify portable archive
        if: steps.version.outputs.publish == 'true'
        run: python3 scripts/package.py
      - name: Commit and push verified release files
        id: revision
        if: steps.version.outputs.publish == 'true'
        env:
          CREATE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        shell: bash
        run: |
          if [[ "$CREATE_COMMIT" == true ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add VERSION PROVENANCE.json README.md VOICE.md
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): v$RELEASE_VERSION"
              git push origin HEAD:main
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish the tag at the version commit
        if: steps.version.outputs.publish == 'true' && steps.current.outputs.tag == ''
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: '^main$'
          custom_tag: ${{ steps.version.outputs.number }}
          commit_sha: ${{ steps.revision.outputs.sha }}
      - name: Write release notes
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_CHANGELOG: ${{ steps.calculate.outputs.changelog }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          header = ('ZapretMac for macOS 12+, Intel and Apple Silicon.\n\n'
                    'Download ZapretMac-*.zip, extract it, and run install.command. '
                    'For Discord voice run voice.command and choose 1.\n\n'
                    'Discord UDP is experimental. A successful PF self-test and an actual '
                    'two-way call on your Mac are required to confirm voice support.\n\n'
                    '[Installation guide](https://github.com/Owl170/zapret-mac#установка-и-запуск)\n\n')
          Path('dist/release-notes.md').write_text(header + os.environ.get('RELEASE_CHANGELOG', ''), encoding='utf-8')
          PY
      - name: Publish GitHub Release with ZIP and checksum
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/ZapretMac-$RELEASE_VERSION.zip" "dist/ZapretMac-$RELEASE_VERSION.zip.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "dist/ZapretMac-$RELEASE_VERSION.zip" "dist/ZapretMac-$RELEASE_VERSION.zip.sha256" --verify-tag --title "ZapretMac $RELEASE_VERSION" --notes-file dist/release-notes.md
          fi
