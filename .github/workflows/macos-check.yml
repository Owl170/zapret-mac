name: macOS validation
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Python checks
        run: python3 -m unittest discover -s tests -v
      - name: Verify Discord probes with system Python
        run: |
          /usr/bin/python3 -m unittest discover -s tests -p test_discord_probe.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_application_update.py -v
          /usr/bin/python3 -m unittest discover -s tests -p test_discord_recovery.py -v
          /usr/bin/python3 -m unittest discover -s tests -p '*cache*.py' -v
          /usr/bin/python3 -m unittest discover -s tests -p test_discord_shutdown.py -v
          /usr/bin/python3 -c 'import ssl; context=ssl.create_default_context(); count=len(context.get_ca_certs()); print("System Python trusted CAs:", count); assert count > 0, "System Python has no trusted certificate roots"'
      - name: Build universal official engine
        run: make -C engine/tpws mac CC=clang CFLAGS='-std=gnu99 -Os -ffunction-sections -fdata-sections' LDFLAGS=''
      - name: Fuzz protocol parsers with address and undefined behavior sanitizers
        run: |
          clang -std=gnu99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Iengine/tpws -Iengine/tpws/macos native/protocol_fuzz.c engine/tpws/protocol.c engine/tpws/helpers.c -o /tmp/zmac-protocol-fuzz
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 /tmp/zmac-protocol-fuzz
      - name: Verify socket address copies under sanitizers
        run: |
          clang -std=gnu99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Iengine/tpws -Iengine/tpws/macos native/address_copy_check.c engine/tpws/helpers.c -o /tmp/zmac-address-copy
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 /tmp/zmac-address-copy
      - name: Verify HTTP and TLS transport for every strategy under sanitizers
        run: |
          clang -std=gnu99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wno-address-of-packed-member -Iengine/tpws/epoll-shim/include -Iengine/tpws/macos engine/tpws/*.c engine/tpws/epoll-shim/src/*.c -lz -lpthread -o /tmp/zmac-tpws-sanitized
          sudo python3 scripts/check_engine_transport.py /tmp/zmac-tpws-sanitized
          sudo python3 scripts/check_engine_transport.py /tmp/zmac-tpws-sanitized --transparent
      - name: Validate actual engine options and PF syntax
        run: sudo python3 scripts/check_native.py engine/tpws/tpws
      - name: Validate PF ABI
        run: |
          clang -Iengine/tpws/macos native/pf_abi_probe.c -o /tmp/zmac-pf-abi
          /tmp/zmac-pf-abi > /tmp/zmac-native-abi.json
          python3 discord_udp.py abi > /tmp/zmac-python-abi.json
          python3 -c 'import json,sys; sys.exit(0 if json.load(open("/tmp/zmac-native-abi.json")) == json.load(open("/tmp/zmac-python-abi.json")) else "PF ABI mismatch")'
      - name: Verify end-to-end PF UDP path
        run: sudo python3 scripts/check_pf_udp.py --trace
